name: 同步镜像到华为云 SWR

on:
  push:
    branches:
      - prod
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/yueyefengs/toonflow-app

jobs:
  sync-to-huawei:
    runs-on: ubuntu-latest
    name: 同步镜像到华为云 SWR
    permissions:
      contents: read
      packages: read

    steps:
      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录华为云 SWR
        uses: docker/login-action@v3
        with:
          registry: swr.cn-north-4.myhuaweicloud.com
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: 拉取、打标签、推送
        run: |
          # 拉取 ghcr 镜像
          docker pull ${{ env.GHCR_IMAGE }}:latest

          # 打华为云标签
          SWR_IMAGE="swr.cn-north-4.myhuaweicloud.com/${{ secrets.SWR_NAMESPACE }}/toonflow-app"
          docker tag ${{ env.GHCR_IMAGE }}:latest $SWR_IMAGE:latest
          docker tag ${{ env.GHCR_IMAGE }}:latest $SWR_IMAGE:${{ github.sha }}

          # 推送到华为云
          docker push $SWR_IMAGE:latest
          docker push $SWR_IMAGE:${{ github.sha }}
